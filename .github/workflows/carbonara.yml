name: Carbonara Check

# Montag 09:00 UTC = 11:00 Wien (CEST, Sommer) bzw. 10:00 Wien (CET, Winter).
# Dolce Pensiero aktualisiert das Menü oft erst spät am Montagmorgen.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Opt-in auf Node.js 24 (Node 20 wird ab 2.6.2026 in Actions removed).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run carbonara check
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python carbonara_check.py
